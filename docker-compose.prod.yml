## Prod: docker compose -f docker-compose.prod.yml up --build
## Nginx serves static frontend + proxies /api to backend

services:
  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
